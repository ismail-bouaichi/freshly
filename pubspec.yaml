name: freshly
description: Freshly — farm-fresh fruits, vegetables & herbs delivered. Built from the Freshly Figma design.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

# No third-party packages: icons and produce illustrations are drawn from
# vector paths (lib/core), and Plus Jakarta Sans is bundled below.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
